# nixpacks.toml
# Fichier de configuration pour le déploiement sur Railway (via Nixpacks)

[phases.build]
cmds = [
    "composer install --no-interaction --optimize-autoloader --no-dev",
    "npm ci",
    "npm run build"
]

[phases.prestart]
cmds = [
    "echo 'Waiting for PostgreSQL to be ready...' && until php artisan db:show > /dev/null 2>&1; do echo 'Database not ready yet, retrying in 3s...'; sleep 3; done && echo 'PostgreSQL is ready!'",
    "php artisan migrate --force",
    "php artisan storage:link || true",
    "php artisan optimize:clear",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]
